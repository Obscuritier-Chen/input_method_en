<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>IME Core Service - Debug</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 40px;
        background: #1e1e1e;
        color: #ddd;
      }
      #editor {
        width: 100%;
        font-size: 18px;
        padding: 10px;
        background: #2d2d2d;
        color: #fff;
        border: 1px solid #555;
        border-radius: 6px;
      }
      #candidates {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .candidate {
        padding: 6px 12px;
        background: #3a3a3a;
        border-radius: 4px;
        font-size: 14px;
      }
      .candidate .score {
        color: #888;
        margin-left: 6px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h2>候选词调试面板</h2>
    <p>输入一句话，最后一个（未完成的）词会被当作 prefix 查询候选</p>
    <input id="editor" type="text" placeholder="i am going to the sch" />
    <div id="candidates"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
