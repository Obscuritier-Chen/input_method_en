[package]
name = "tsf_service"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# windows = { version = "0.58", features = [...] }  # 后面接 TSF 时再加
windows = {version = "0.58",features = [    
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_TextServices",
    "implement",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_Graphics_Gdi"]}
windows-core = "0.58"
serde_json = "1.0"
ime_protocol = { path = "../ime_protocol" }
tokio = { version = "1", features = ["macros", "rt", "time", "net", "io-util", "sync"] }